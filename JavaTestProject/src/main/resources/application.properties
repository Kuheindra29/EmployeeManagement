#################################################
# APPLICATION
#################################################

spring.application.name=employee-management

#################################################
# H2 DATABASE
#################################################

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

#################################################
# H2 CONSOLE
#################################################

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#################################################
# JPA / HIBERNATE
#################################################

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

#################################################
# DATA INITIALIZATION
#################################################

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

#################################################
# SWAGGER / OPENAPI
#################################################

springdoc.swagger-ui.path=/swagger-ui.html

#################################################
# LOGGING
#################################################

logging.level.root=INFO
logging.level.com.kuheindra.employees=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n

#################################################
# HIBERNATE SQL LOGGING (DEV)
#################################################

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

#################################################
# EXTERNAL API SETTINGS
#################################################

external.api.connect-timeout=5000
external.api.read-timeout=5000

#################################################
# SERVER
#################################################

server.port=8080

#################################################
# ACTUATOR (IF ADDED LATER)
#################################################

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always